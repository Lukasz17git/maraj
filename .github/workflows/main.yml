name: CI
on:
   workflow_dispatch:
   push:
    branches:
      - "**"
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm install
      - run: npm run ci